<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude sessions</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-title" content="Sessions">
<meta name="mobile-web-app-capable" content="yes">
<link id="theme-css" rel="stylesheet" href="__CS_THEME__">
</head>
<body>
<div class="app">
  <header class="top"><div class="top-info" id="head"><span class="brand">✻ Claude sessions</span></div>
    <nav class="tabs" id="tabs" aria-label="View"><button type="button" data-tab="sessions">sessions</button><button type="button" data-tab="tasks">tasks <span class="tab-n" id="tabN"></span></button><button type="button" data-tab="tx">transcripts</button></nav>
    <label class="theme-pick"><span>theme</span><select id="theme" aria-label="Theme"></select></label></header>
  <main class="body" id="main">
    <div class="tiles" id="tiles"></div>
    <div class="tbl-wrap" id="table" hidden></div>
    <section class="tx-view" id="txView" aria-label="Transcripts" hidden>
      <form class="tk-bar tx-new" id="txNew" autocomplete="off">
        <span class="dim">new session in</span>
        <input name="cwd" list="txDirs" placeholder="project folder" spellcheck="false" aria-label="Project folder" required>
        <select name="mode" aria-label="Permission mode"><option value="default">ask before tools</option><option value="plan">plan first</option><option value="acceptEdits">accept edits</option></select>
        <input name="text" class="tx-first" placeholder="first message (optional)" spellcheck="false" aria-label="First message">
        <button type="submit" class="tk-btn primary">start</button>
        <datalist id="txDirs"></datalist>
      </form>
      <div class="txs" id="txs"></div>
    </section>
    <section class="tasks" id="tasks" aria-label="Tasks" hidden>
      <div class="tk-bar">
        <button type="button" class="tk-btn primary" id="tkNew">+ new task</button>
        <div class="tk-seg" id="tkShow">show <button type="button" data-show="open">open</button><span class="dim">·</span><button type="button" data-show="all">all</button></div>
        <span class="tk-sum" id="tkSum"></span>
        <div class="tk-inbox">
          <span class="tk-scan" id="tkScanInfo"></span>
          <label class="tk-auto" title="scan the inbox automatically while cs runs"><input type="checkbox" id="tkAuto"> auto every <select id="tkEvery" aria-label="Minutes between scans"><option value="5">5</option><option value="10">10</option><option value="15">15</option><option value="30">30</option><option value="60">60</option></select> min</label>
          <label class="tk-auto" title="where analyze and resume open the Claude session">sessions in <select id="tkTerm" aria-label="Terminal for task sessions"></select></label>
          <button type="button" class="tk-btn" id="tkMail">inbox log</button>
          <button type="button" class="tk-btn" id="tkScan">scan inbox</button>
        </div>
      </div>
      <section class="tk-mail" id="tkMailBox" aria-label="Inbox log" hidden>
        <div class="tk-mail-hd"><span class="tk-mail-title">inbox log</span><span class="tk-mail-sub" id="tkMailSub"></span><button type="button" class="tk-x" id="tkMailClose" title="close (m)" aria-label="Close">✕</button></div>
        <div class="tk-mail-list" id="tkMailList"></div>
      </section>
      <form class="tk-form" id="tkForm" autocomplete="off" hidden>
        <div class="tk-form-head" id="tkFormHead">new task</div>
        <label class="f-title"><span>title</span><input name="title" maxlength="200" spellcheck="false"></label>
        <label class="f-proj"><span>project</span><input name="project" list="tkProjects" placeholder="client/repo, or just the client" spellcheck="false"></label>
        <label><span>kind</span><select name="kind"><option value="fix">fix · change code</option><option value="check">check · investigate</option></select></label>
        <label><span>priority</span><select name="priority"><option value="">none</option><option value="high">high</option><option value="medium">medium</option><option value="low">low</option></select></label>
        <label class="f-sum"><span>description</span><textarea name="summary" rows="5"></textarea></label>
        <div class="tk-form-acts"><button type="submit" class="tk-btn primary">save</button><button type="button" class="tk-btn" id="tkCancel">cancel</button><span class="tk-err" id="tkErr"></span></div>
        <datalist id="tkProjects"></datalist>
      </form>
      <div class="tk-wrap" id="tkWrap">
        <div class="tk-list" id="tkList"></div>
        <aside class="tk-detail" id="tkDetail" aria-label="Task" hidden>
          <div id="tkInfo"></div>
          <div class="tk-ctl">
            <label>status <select id="tkStatus"></select></label>
            <label>priority <select id="tkPrio"><option value="">none</option><option value="high">high</option><option value="medium">medium</option><option value="low">low</option></select></label>
            <label>kind <select id="tkKind"><option value="fix">fix</option><option value="check">check</option></select></label>
          </div>
          <div class="tk-acts">
            <button type="button" class="tk-btn" id="tkEdit">edit</button>
            <button type="button" class="tk-btn" id="tkSub">+ subtask</button>
            <button type="button" class="tk-btn" id="tkOpen">open in VS Code</button>
            <button type="button" class="tk-btn" id="tkDismiss" title="reject it and teach the inbox scan that mail like this is not a task">not a task</button>
            <button type="button" class="tk-btn danger" id="tkDel">delete</button>
          </div>
          <input class="tk-note" id="tkNote" autocomplete="off" spellcheck="false" placeholder="add a note · enter saves" aria-label="Add a note">
          <div class="tk-log" id="tkLog"></div>
        </aside>
      </div>
    </section>
    <p class="empty" id="empty">Loading sessions…</p>
    <p class="note" id="note"></p>
  </main>
  <footer class="dock">
    <nav class="projects" id="projects" aria-label="Projects">
      <span class="proj-label">projects</span>
      <div class="proj-list" id="projList"></div>
      <div class="proj-find"><input id="projQ" autocomplete="off" spellcheck="false" placeholder="search projects (p)" aria-label="Search projects"><div class="proj-menu" id="projMenu" role="listbox" hidden></div></div>
      <button class="proj-dir" id="projDir" type="button"></button>
      <input class="proj-dir-in" id="projDirIn" autocomplete="off" spellcheck="false" aria-label="Projects folder" hidden>
    </nav>
    <section class="chat" id="chat" aria-label="Ask Claude">
      <div class="chat-head"><span class="chat-title">✻ Ask Claude</span><span class="chat-side" id="chatSide"></span></div>
      <div class="chat-log" id="chatLog" hidden></div>
      <div class="chat-field"><span class="p">❯</span><input id="ask" autocomplete="off" spellcheck="false" aria-label="Ask Claude"></div>
    </section>
    <div class="usage" id="usage"></div>
    <div class="hint" id="hint"></div>
  </footer>
</div>
<script>
"use strict";
const TOKEN = "__CS_TOKEN__";
const SPIN = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏", STAR = "·✢✳✶✻✽✻✶✳✢";
const LOGO = [" ▐▛███▜▌  ", "▝▜█████▛▘ ", "  ▘▘ ▝▝   "];
const LEGS_B = "   ▝▝ ▘▘  ";
const TIP = "open a repo in VS Code, show it in Finder…";
const SHORT = { "general-purpose": "general", "claude-code-guide": "guide", "statusline-setup": "statusline" };
const RM = matchMedia("(prefers-reduced-motion: reduce)");
const $ = id => document.getElementById(id);
const ask = $("ask");

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let S = null;
let sel = null;
let showAll = store.get("cs.all") === "1";
let view = store.get("cs.view") === "table" ? "table" : "tiles";
let flash = ["", 0];
let offline = false;
let FRAME = 0;
let lastPoll = 0, polling = false, chatSig = "";
let themeSetAt = 0;
let projSel = 0, projSig = "";
let tab = ["tasks", "tx"].includes(store.get("cs.tab")) ? store.get("cs.tab") : "sessions";
let tkShow = store.get("cs.tkshow") === "all" ? "all" : "open";
let tkSel = null, tkCur = null, tkLoading = null, tkMode = null, tkSig = "", tkInfoSig = "", tkDlSig = "";
let mailOpen = false, mailData = null, mailKey = "", mailSig = "", scanSig = "";

const TS = {
  new: ["new", "var(--fg)", "○"],
  queued: ["queued", "var(--wait)", "◌"],
  analyzing: ["analyzing", "var(--orange)", ""],
  awaiting_approval: ["to approve", "var(--amber)", "◆"],
  implementing: ["implementing", "var(--orange)", ""],
  in_review: ["to review", "var(--amber)", "◆"],
  needs_info: ["needs info", "var(--violet)", "?"],
  done: ["done", "var(--green)", "✓"],
  rejected: ["rejected", "var(--gray)", "■"],
  failed: ["failed", "var(--red)", "✗"],
};
const T_SORT = ["awaiting_approval", "in_review", "needs_info", "failed", "analyzing", "implementing", "queued", "new", "done", "rejected"];
const T_YOU = new Set(["awaiting_approval", "in_review", "needs_info", "failed"]);
const PRIO = { high: 0, medium: 1, low: 2 };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const one = s => String(s ?? "").split(/\s+/).filter(Boolean).join(" ");
const p2 = n => String(n).padStart(2, "0");
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n);
const nowS = () => Date.now() / 1000;
function ago(ms) {
  const s = Math.max(0, Math.floor(nowS() - ms / 1000));
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h${p2(Math.floor(s % 3600 / 60))}m` : `${Math.floor(s / 86400)}d`;
}
function dur(sec) {
  sec = Math.floor(Math.max(0, sec));
  return sec < 60 ? `${sec}s` : sec < 3600 ? `${Math.floor(sec / 60)}m${p2(sec % 60)}s` : `${Math.floor(sec / 3600)}h${p2(Math.floor(sec % 3600 / 60))}m`;
}
function rem(sec) {
  sec = Math.floor(Math.max(0, sec));
  const dd = Math.floor(sec / 86400), hh = Math.floor(sec % 86400 / 3600), mm = Math.floor(sec % 3600 / 60);
  return dd ? `${dd}d${hh}h` : hh ? `${hh}h${p2(mm)}m` : `${mm}m`;
}
const win = r => S.cfg.window || (r.peak > 200000 ? 1000000 : 200000);
const home = p => { const h = S.cfg.home; return p && h && p.startsWith(h) ? "~" + p.slice(h.length) : p || ""; };
const pctColor = p => p >= 85 ? "var(--red)" : p >= 60 ? "var(--amber)" : "var(--green)";

function stateOf(r) {
  if (r.status === "busy") return ["RUNNING", "s-busy"];
  if (r.status === "idle") return ["WAITING", "s-idle"];
  if (r.status === "ended") return ["ENDED", "s-ended"];
  return [String(r.status).toUpperCase(), "s-other"];
}

function agentCounts(r) {
  const ags = r.agents || [];
  const running = ags.filter(a => a.state === "running").sort((a, b) => (a.t0 || 0) - (b.t0 || 0));
  const nrun = running.reduce((s, a) => s + (a.kind === "workflow" ? (a.nrun || 1) : 1), 0);
  const ndone = ags.reduce((s, a) => s + (a.kind === "workflow" ? (a.ndone || 0) : a.state !== "running" ? 1 : 0), 0);
  return { running, nrun, ndone };
}

function agentBlock(r) {
  const ags = r.agents || [];
  if (!ags.length) return "";
  const now = nowS();
  const { running, nrun, ndone } = agentCounts(r);
  const recent = ags.filter(a => !["running", "lost"].includes(a.state) && a.t1 && now - a.t1 < 60).sort((a, b) => b.t1 - a.t1);
  let show = running.concat(recent), more = 0;
  const max = S.cfg.agent_rows;
  if (show.length > max) { more = show.length - max + 1; show = show.slice(0, max - 1); }
  let h = `<div class="agents"><div><span class="dim">AGENTS</span>`
    + (nrun ? ` <b class="o">${nrun}</b> <span class="dim">running</span>` : "")
    + (nrun && ndone ? ` <span class="dim">·</span>` : "")
    + (ndone ? ` ${ndone} <span class="dim">done</span>` : "") + `</div><div class="grid">`;
  show.forEach((a, k) => {
    const on = a.state === "running";
    let ic, right;
    if (on) {
      ic = `<span class="o" data-spin="${k}">${SPIN[(FRAME + k * 3) % 10]}</span>`;
      const act = a.kind === "workflow" ? `${a.phase || "running"} ${a.ndone}/${a.ndone + a.nrun}` : a.act || "starting";
      right = `${act} ${dur(now - (a.t0 || now))}`;
    } else {
      ic = a.state === "completed" ? `<span style="color:var(--wait)">✓</span>` : a.state === "failed" ? `<span style="color:var(--red)">✗</span>` : `<span style="color:var(--gray)">■</span>`;
      right = `${a.state === "completed" ? "done" : a.state} ${dur(a.t1 - (a.t0 || a.t1))}`;
    }
    const ty = SHORT[a.type] || a.type;
    const desc = one(a.desc) || "-";
    h += `<span>${ic}</span><span class="ty ${on ? "on" : "dim"}">${esc(ty)}</span>`
      + `<span class="${on ? "" : "dim"}" title="${esc(desc)}">${esc(desc)}</span><span class="right" title="${esc(right)}">${esc(right)}</span>`;
  });
  h += `</div>`;
  if (more) h += `<div class="more">+${more} more</div>`;
  return h + `</div>`;
}

function tileHTML(r) {
  const [label, cls] = stateOf(r);
  const busy = r.status === "busy";
  const w = win(r);
  const pct = Math.min(100, r.ctx / w * 100);
  const bc = pct >= 85 ? "var(--red)" : pct >= 60 ? "var(--amber)" : "var(--sc)";
  const ent = { "claude-vscode": "VS Code", cli: "CLI" }[r.entry] ?? (r.entry || "");
  const tk = (S.tasks?.list || []).find(x => x.session_id === r.sid);
  const tag = (tk ? `task #${tk.id} · ` : "") + (r.pid ? `#${r.pid}` + (ent ? ` · ${ent}` : "") : "transcript");
  const wd = home(r.cwd);
  const br = r.branch && r.branch !== "HEAD" ? r.branch : "";
  let task;
  if (busy) {
    const tt = one(r.cur_task || r.prompt);
    task = tt ? `<span class="o">▶</span> <span title="${esc(tt)}">${esc(tt)}</span>` : `<span class="dim">working…</span>`;
  } else {
    const tt = one(r.done_task || r.prompt);
    task = tt ? `<span style="color:var(--wait)">✓</span> <span class="dim" title="${esc(tt)}">${esc(tt)}</span>` : `<span class="dim">-</span>`;
  }
  const rainbow = r.ultra && r.live;
  const pair = (l1, v1, l2, v2) => `<span><span class="dim">${l1}</span> ${esc(v1)}</span><span><span class="dim">${l2}</span> ${esc(v2)}</span>`;
  return `<article class="tile ${cls}${r.sid === sel ? " sel" : ""}" data-key="${esc(r.sid)}" data-sid="${esc(r.sid)}">`
    + (busy ? `<div class="edge"><i></i></div>` : "")
    + `<div class="tag" title="${esc(r.sid)}">${esc(tag)}</div>`
    + `<div class="hd"><pre class="logo${rainbow ? " rainbow" : ""}">${LOGO[0]}\n${LOGO[1]}\n<span${busy ? " data-legs" : ""}>${LOGO[2]}</span></pre>`
    + `<div class="name" title="${esc(r.name || r.sid)}">${esc(r.name || r.sid.slice(0, 8))}</div>`
    + `<div class="st"><span${busy ? " data-pulse" : ""}>●</span> <b>${esc(label)}</b>${busy ? ` <span data-spin="0">${SPIN[FRAME % 10]}</span>` : ""}</div></div>`
    + `<dl class="kv"><dt>dir</dt><dd class="path" title="${esc(wd)}">&lrm;${esc(wd)}&lrm;</dd>`
    + `<dt>git</dt><dd>${br ? `<span class="cy">${esc(br)}</span>` : `<span class="dim">none</span>`}</dd>`
    + `<dt>task</dt><dd>${task}</dd></dl>`
    + agentBlock(r)
    + `<div class="ctx" style="--bc:${bc}"><div class="line"><span><span class="dim">CONTEXT</span> ${fmt(r.ctx)}<span class="dim">/${fmt(w)}</span></span>`
    + `<b style="color:var(--bc)">${pct.toFixed(0)}%</b></div><div class="bar"><i style="width:${pct.toFixed(2)}%"></i></div></div>`
    + `<div class="meta"><div><span class="dim">MODEL</span> ${esc(String(r.model).replace("claude-", ""))}</div>`
    + `<div class="pairs">${pair("turns", r.turns, "tools", r.tools)}${pair("out", fmt(r.out), "cache", fmt(r.cread))}`
    + `${pair("up", r.uptime, "idle", r.updated ? ago(r.updated) : "-")}</div></div></article>`;
}

function tableHTML(rows) {
  let h = `<table class="tbl"><thead><tr><th>PID</th><th>STATUS</th><th>CONTEXT</th><th>MODEL</th><th class="num">TURNS</th><th class="num">TOOLS</th>`
    + `<th class="num">OUT</th><th class="num">CACHE-R</th><th class="num">UP</th><th class="num">IDLE</th><th>SESSION</th></tr></thead><tbody>`;
  for (const r of rows) {
    const pct = r.ctx / win(r) * 100;
    const c = pct >= 85 ? "var(--red)" : pct >= 60 ? "var(--amber)" : "var(--green)";
    const sc = r.status === "busy" ? "var(--green)" : r.status === "idle" ? "var(--amber)" : "var(--dim)";
    const proj = String(r.cwd).replace(/\/+$/, "").split("/").pop() || r.cwd;
    const nag = agentCounts(r).nrun;
    h += `<tr data-sid="${esc(r.sid)}"${r.sid === sel ? ` class="sel"` : ""}><td>${esc(r.pid || "-")}</td><td style="color:${sc}">${esc(r.status)}</td>`
      + `<td>${meter(pct, 10, c)} ${fmt(r.ctx).padStart(5, " ")} ${pct.toFixed(0).padStart(3, " ")}%</td>`
      + `<td>${esc(String(r.model).replace("claude-", ""))}</td><td class="num">${r.turns}</td><td class="num">${r.tools}</td>`
      + `<td class="num">${fmt(r.out)}</td><td class="num">${fmt(r.cread)}</td><td class="num">${esc(r.uptime)}</td>`
      + `<td class="num">${r.updated ? ago(r.updated) : "-"}</td>`
      + `<td class="label">${esc(r.name || r.title || r.sid.slice(0, 8))} <span class="dim">[${esc(proj)}]</span>`
      + (nag ? ` <span style="color:var(--amber)">· ${nag} agent${nag !== 1 ? "s" : ""}</span>` : "") + `</td></tr>`;
  }
  const live = rows.filter(r => r.live).length;
  return h + `</tbody></table><p class="note">${live} live / ${rows.length} shown</p>`;
}

function headHTML(rows) {
  const live = rows.filter(r => r.live);
  const nrun = live.filter(r => r.status === "busy").length;
  const nwait = live.filter(r => r.status === "idle").length;
  const nother = live.length - nrun - nwait;
  const nag = live.reduce((s, r) => s + agentCounts(r).nrun, 0);
  const d = new Date();
  return `<span class="brand">✻ Claude sessions</span>`
    + `<span class="count"><span class="dot o">●</span>${nrun} running</span>`
    + `<span class="count"><span class="dot" style="color:var(--wait)">●</span>${nwait} waiting</span>`
    + (nother ? `<span class="count"><span class="dot" style="color:var(--amber)">●</span>${nother} other</span>` : "")
    + (nag ? `<span class="count"><span class="dot" style="color:var(--violet)">◆</span>${nag} agent${nag !== 1 ? "s" : ""}</span>` : "")
    + `<span class="dim">${fmt(live.reduce((s, r) => s + r.ctx, 0))} context · ${fmt(rows.reduce((s, r) => s + r.out, 0))} output · ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}</span>`;
}

function meter(pct, n, color) {
  const f = Math.max(0, Math.min(n, Math.round(pct / 100 * n)));
  return `<span class="meter" style="--c:${color};--p:${Math.max(0, Math.min(100, pct)).toFixed(1)}%">`
    + `<span class="on">${"█".repeat(f)}</span><span class="off">${"░".repeat(n - f)}</span></span>`;
}

function usageHTML(d) {
  if (!d) return `<span class="dim">usage limits: no data yet (appears after the next status line refresh)</span>`;
  const rl = d.rate_limits || {}, now = nowS(), parts = [];
  const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const at = (t, long) => { const x = new Date(t * 1000); return (long ? DAYS[x.getDay()] + " " : "") + `${p2(x.getHours())}:${p2(x.getMinutes())}`; };
  for (const [key, lab, long] of [["five_hour", "5h", false], ["seven_day", "7d", true]]) {
    const w = rl[key];
    if (!w) continue;
    const pct = Number(w.used_percentage) || 0, rs = w.resets_at;
    if (rs && rs < now) { parts.push(`<b>${lab}</b> <span class="dim">window reset</span>`); continue; }
    const n = 14, c = pctColor(pct);
    const when = rs ? ` <span class="dim">resets</span> ${at(rs, long)} <span class="dim">(in ${rem(rs - now)})</span>` : "";
    parts.push(`<b>${lab}</b> ${meter(pct, n, c)} <b style="color:${c}">${pct.toFixed(0)}%</b>${when}`);
  }
  if (!parts.length) return `<span class="dim">usage limits: n/a</span>`;
  const sep = `<span class="sep">│</span>`;
  return parts.join(sep) + sep + `<span class="dim">updated ${rem(now - (d.ts ?? now))} ago</span>`;
}

function msgsHTML(log) {
  const h = S.cfg.home;
  let out = "";
  for (const [kind, text] of log) {
    if (kind === "tool") {
      let cmd = String(text).split("\n")[0];
      if (h) cmd = cmd.split(h).join("~");
      out += `<div class="msg tool"><span class="g">⎿</span><span class="t" title="${esc(cmd)}">${esc(cmd)}</span></div>`;
    } else {
      const g = kind === "you" ? "›" : kind === "claude" ? "⏺" : "✗";
      out += `<div class="msg ${kind === "you" || kind === "claude" ? kind : "err"}"><span class="g">${g}</span><span>${esc(one(text))}</span></div>`;
    }
  }
  return out;
}

function chatHTML() {
  let out = msgsHTML(S.chat.log);
  if (S.chat.working) out += `<div class="working"><span data-star>${STAR[FRAME % 10]}</span> Working… <span class="dim">${Math.max(0, Math.floor(nowS() - S.chat.t0))}s</span></div>`;
  return out;
}

function txPlaceholder(r) {
  const t = r.tx;
  if (t.pend) return "or type a reply: it denies with your message";
  if (t.mode === "owned") return t.sending ? "working · enter queues a message" : "enter sends";
  if (t.mode === "type") return `type to its ${t.app} tab · enter sends`;
  if (t.mode === "resume") return "ended · enter resumes it in cs with your message";
  return t.app ? `runs in ${t.app}: read-only here, focus it to type` : "no terminal: read-only";
}

function renderTx() {
  const box = $("txs");
  if (tab !== "tx") return;
  const dirs = (S.projects || []).map(p => p.path), dsig = dirs.join("\n");
  if ($("txDirs")._sig !== dsig) { $("txDirs").replaceChildren(...dirs.map(d => new Option(home(d), home(d)))); $("txDirs")._sig = dsig; }
  const rows = S.sessions.filter(r => r.tx);
  const old = new Map([...box.children].map(el => [el.dataset.sid, el]));
  let prev = null;
  for (const r of rows) {
    let el = old.get(r.sid);
    old.delete(r.sid);
    if (!el) {
      el = document.createElement("article");
      el.dataset.sid = r.sid;
      el.innerHTML = `<div class="chat-head"><span class="chat-title"></span><span class="chat-side"></span></div><div class="chat-log"></div>`
        + `<div class="tx-ask" hidden></div>`
        + `<div class="chat-field"><span class="p">❯</span><input class="tx-input" autocomplete="off" spellcheck="false">`
        + `<button type="button" class="tk-btn" data-act="stop"></button><button type="button" class="tk-btn" data-act="focus">focus</button></div>`;
    }
    const [label, cls] = stateOf(r), t = r.tx;
    el.className = `chat txbox ${cls}${r.sid === sel ? " sel" : ""}${el.contains(document.activeElement) ? " on" : ""}`;
    const tk = (S.tasks?.list || []).find(x => x.session_id === r.sid);
    const title = (tk ? `task #${tk.id} · ` : "") + (r.name || r.sid.slice(0, 8));
    const side = `${label.toLowerCase()} · ${String(r.cwd).replace(/\/+$/, "").split("/").pop()}${t.app ? ` · ${t.app}` : ""}`;
    const hd = el.querySelector(".chat-head");
    if (hd._sig !== title + side) { hd.children[0].textContent = `✻ ${title}`; hd.children[1].textContent = side; hd.title = r.sid; hd._sig = title + side; }
    const lg = el.querySelector(".chat-log");
    const sig = JSON.stringify([t.log, t.sending, t.err, r.status]);
    if (lg._sig !== sig) {
      lg.innerHTML = msgsHTML(t.log)
        + (t.sending || r.status === "busy" ? `<div class="working"><span data-spin="0">${SPIN[FRAME % 10]}</span> Working…</div>` : "")
        + (t.err ? `<div class="msg err"><span class="g">✗</span><span>${esc(t.err)}</span></div>` : "");
      lg._sig = sig;
    }
    const ask = el.querySelector(".tx-ask"), asig = JSON.stringify(t.pend);
    if (ask._sig !== asig) {
      ask.hidden = !t.pend;
      ask.innerHTML = !t.pend ? "" : (t.pend.plan != null
        ? `<div class="tx-ask-q"><b class="tk-you">◆ the plan waits for you</b></div><div class="tx-plan">${esc(t.pend.plan)}</div>`
        : `<div class="tx-ask-q"><b class="tk-you">◆ allow ${esc(t.pend.tool)}?</b> <span class="dim">${esc(one(t.pend.what))}</span></div>`)
        + `<div class="tk-acts"><button type="button" class="tk-btn primary" data-act="allow">${t.pend.plan != null ? "approve" : "allow"}</button><button type="button" class="tk-btn" data-act="deny">deny</button></div>`;
      ask._sig = asig;
    }
    const inp = el.querySelector("input");
    inp.disabled = t.mode === "none";
    inp.placeholder = txPlaceholder(r);
    inp.setAttribute("aria-label", `Message to ${title}`);
    const stop = el.querySelector("[data-act=stop]");
    stop.hidden = t.mode !== "owned";
    stop.textContent = t.sending ? "stop" : "close";
    stop.title = t.sending ? "interrupt the current turn" : "end this session (you can resume it later)";
    el.querySelector("[data-act=focus]").hidden = !r.live || t.mode === "owned";
    const want = prev ? prev.nextElementSibling : box.firstElementChild;
    if (el !== want) box.insertBefore(el, want);
    if (!lg._up) lg.scrollTop = lg.scrollHeight;
    prev = el;
  }
  for (const el of old.values()) el.remove();
}

function patch(box, items) {
  const old = new Map([...box.children].map(el => [el.dataset.key, el]));
  let prev = null;
  for (const { key, html } of items) {
    let el = old.get(key);
    old.delete(key);
    if (!el || el._html !== html) {
      const t = document.createElement("template");
      t.innerHTML = html;
      const n = t.content.firstElementChild;
      n._html = html;
      syncAnim(n);
      if (el) el.replaceWith(n);
      el = n;
    }
    const want = prev ? prev.nextElementSibling : box.firstElementChild;
    if (el !== want) box.insertBefore(el, want);
    prev = el;
  }
  old.forEach(el => el.remove());
}

function syncAnim(el) {
  const t = performance.now();
  el.querySelectorAll(".edge i").forEach(x => x.style.animationDelay = `-${t % 1800}ms`);
  el.querySelectorAll(".logo.rainbow").forEach(x => x.style.animationDelay = `-${t % 2400}ms`);
}

function chatOn() { return document.activeElement === ask; }

function projMatch(q, items) {
  q = q.toLowerCase().trim();
  if (!q) return items;
  const score = p => {
    const n = p.name.toLowerCase(), r = p.rel.toLowerCase();
    if (n.startsWith(q)) return 0;
    if (n.includes(q)) return 1;
    if (r.includes(q)) return 2;
    let i = 0;
    for (const c of q.replace(/ /g, "")) { i = r.indexOf(c, i) + 1; if (!i) return null; }
    return 3;
  };
  return items.map((p, i) => [score(p), i, p]).filter(h => h[0] !== null).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(h => h[2]);
}

function renderProjects() {
  const all = S.projects || [], cfg = S.cfg.projects || {};
  const recent = all.filter(p => p.t);
  const show = recent.length ? recent : all;
  const sig = JSON.stringify(show.map(p => [p.path, p.name]));
  if (sig !== projSig) {
    $("projList").innerHTML = show.length
      ? show.map(p => `<button type="button" class="proj" data-path="${esc(p.path)}" title="${esc(home(p.path))} · open in VS Code">${esc(p.name)}</button>`).join("")
      : `<span class="dim">no git repos in ${esc(cfg.dir)}</span>`;
    projSig = sig;
  }
  const dir = $("projDir");
  dir.textContent = cfg.env ? "$CS_REPO_ROOTS" : cfg.dir;
  dir.title = cfg.env ? "set by CS_REPO_ROOTS, which overrides the setting" : "projects folder · click to change";
}

function renderMenu() {
  const q = $("projQ"), m = $("projMenu");
  if (document.activeElement !== q || !S) { m.hidden = true; return; }
  const hits = projMatch(q.value, S.projects || []).slice(0, 12);
  projSel = Math.max(0, Math.min(projSel, hits.length - 1));
  m.innerHTML = hits.length
    ? hits.map((p, i) => `<div class="proj-opt${i === projSel ? " on" : ""}" role="option" aria-selected="${i === projSel}" data-path="${esc(p.path)}"><span class="n">${esc(p.name)}</span><span class="r">${esc(p.rel)}</span></div>`).join("")
    : `<div class="proj-none">no match</div>`;
  m.hidden = false;
  m._hits = hits;
}

const isOpen = t => t.status !== "done" && t.status !== "rejected";
const tkTasks = () => S?.tasks?.list || [];
const tkLabel = t => (TS[t.status] || [t.status])[0];
const tkColor = t => (TS[t.status] || [0, "var(--dim)"])[1];
function tkIcon(t) {
  const ic = (TS[t.status] || [0, 0, "·"])[2];
  return ic ? esc(ic) : `<span data-spin="0">${SPIN[FRAME % 10]}</span>`;
}
const needs = n => `<b class="tk-you">${n} need${n === 1 ? "s" : ""} you</b>`;
const gmail = u => /^https:\/\/mail\.google\.com\//.test(u || "") ? u : "";
function when(s) {
  const d = new Date(s);
  return isNaN(d) ? s || "" : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
}

function scanHTML(ib) {
  if (!ib) return "";
  if (ib.running) return `<span class="o"><span data-spin="0">${SPIN[FRAME % 10]}</span> scanning the inbox… ${dur(nowS() - (ib.t0 || nowS()))}</span>`;
  const l = ib.last;
  let h = !l ? `<span class="dim">no scan yet</span>`
    : l.ok ? `last scan ${ago(l.t0 * 1000)} ago` + (l.created ? ` · <b class="o">${l.created} new</b>` : "") + (l.updated ? ` · ${l.updated} updated` : "")
    : `<span class="err" title="${esc(l.error || "")}">scan failed ${ago(l.t0 * 1000)} ago: ${esc(one(l.error || "unknown error").slice(0, 80))}</span>`;
  if (ib.auto && ib.next) h += ` <span class="dim">· next ${ib.next <= nowS() ? "soon" : "in " + rem(ib.next - nowS())}</span>`;
  return h;
}

function mailHTML() {
  if (!mailData) return `<p class="dim">loading…</p>`;
  if (!mailData.threads.length) return `<p class="dim">No email seen yet. Every inbox thread a scan looks at is listed here with its verdict.</p>`;
  return mailData.threads.map(th => {
    const task = th.outcome === "task", url = gmail(th.url);
    const act = task ? (th.task_id ? `<a href="#" data-goto="${th.task_id}">task #${th.task_id}</a>` : `<span class="dim">task deleted</span>`)
      : `<button type="button" class="tm-make" data-make="${esc(th.id)}">make task</button>`;
    const subj = esc(th.subject || "(no subject)");
    return `<div class="tm-row${task ? " task" : ""}"><span class="tm-o">${task ? "✓" : "–"}</span>`
      + `<span class="tm-date" title="${esc(when(th.date))}">${th.date && !isNaN(new Date(th.date)) ? ago(new Date(th.date).getTime()) : ""}</span>`
      + `<span class="tm-from" title="${esc(th.sender)}">${esc(th.sender)}</span>`
      + `<span class="tm-subj" title="${subj}">${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${subj}</a>` : subj}</span>`
      + `<span class="tm-why" title="${esc(th.reason || "")}">${esc(th.reason || "")}</span><span class="tm-act">${act}</span></div>`;
  }).join("");
}

  try { mailData = await api("/api/inbox"); }

function renderInbox() {
  const ib = S.tasks?.inbox;
  const sh = scanHTML(ib);
  if (sh !== scanSig) { $("tkScanInfo").innerHTML = sh; scanSig = sh; }
  $("tkScan").disabled = !ib || ib.running;
  if (ib) {
    if (document.activeElement !== $("tkAuto")) $("tkAuto").checked = ib.auto;
    const ev = $("tkEvery");
    if (![...ev.options].some(o => o.value === String(ib.every))) ev.add(new Option(String(ib.every), String(ib.every)));
    if (document.activeElement !== ev) ev.value = String(ib.every);
  }
  const tm = $("tkTerm"), term = S.cfg.terminal || { app: "Terminal", list: ["Terminal"] };
  if (tm.options.length !== term.list.length) tm.replaceChildren(...term.list.map(n => new Option(n === "cs" ? "dashboard (cs)" : n, n)));
  if (document.activeElement !== tm) tm.value = term.app;
  $("tkMail").classList.toggle("on", mailOpen);
  $("tkMailBox").hidden = !mailOpen;
  if (!mailOpen) return;
  const key = JSON.stringify([ib?.last?.id, ib?.last?.t1, tkTasks().length]);
  if (key !== mailKey) { mailKey = key; loadMail(); }

  $("tkMailSub").textContent = mailData ? `${mailData.threads.length} threads · last ${scans.length} scans cost $${scans.reduce((s, x) => s + (x.cost || 0), 0).toFixed(2)} · ${ib?.model || ""}` : "";
  const html = mailHTML();
  if (html !== mailSig) { $("tkMailList").innerHTML = html; mailSig = html; }
}

function tasksHTML() {
  const all = tkTasks(), ids = new Set(all.map(t => t.id)), kids = new Map();
  for (const t of all) if (t.parent_id && ids.has(t.parent_id)) {
    if (!kids.has(t.parent_id)) kids.set(t.parent_id, []);
    kids.get(t.parent_id).push(t);
  }
  const vis = t => tkShow === "all" || isOpen(t) || (kids.get(t.id) || []).some(vis);
  const order = (a, b) => T_SORT.indexOf(a.status) - T_SORT.indexOf(b.status) || (PRIO[a.priority] ?? 3) - (PRIO[b.priority] ?? 3) || b.updated - a.updated;
  const roots = all.filter(t => !(t.parent_id && ids.has(t.parent_id)) && vis(t)).sort(order);
  if (!roots.length) return all.length
    ? `<p class="empty">No open tasks. Press <b>a</b> to show done and rejected ones too.</p>`
    : `<p class="empty">No tasks yet. Press <b>n</b> to add one.</p>`;
  const row = (t, d) => {
    let h = `<div class="tk-row${t.id === tkSel ? " sel" : ""}${isOpen(t) ? "" : " closed"}" data-tid="${t.id}" style="--tc:${tkColor(t)};--d:${d}">`
      + `<span class="tk-ic">${tkIcon(t)}</span><span class="tk-id">#${t.id}</span>`
      + `<span class="tk-title" title="${esc(t.title)}">${d ? `<span class="dim">└ </span>` : ""}`
      + `${t.source === "email" ? `<span class="tk-src" title="from email">✉&#xFE0E;</span> ` : ""}${esc(t.title)}</span>`
      + `<span class="tk-tags">${t.priority ? `<span class="tk-prio p-${esc(t.priority)}">${esc(t.priority)}</span>` : ""}<span class="tk-kind">${esc(t.kind)}</span></span>`
      + `<span class="tk-st">${esc(tkLabel(t))}${t.sess ? ` <span class="tk-live" title="its Claude session is ${t.sess.status === "busy" ? "working" : "waiting for you"}">${t.sess.status === "busy" ? "●" : "○"}</span>` : ""}</span>`
      + `<span class="tk-age" title="last change">${ago(t.updated * 1000)}</span></div>`;
    for (const k of (kids.get(t.id) || []).filter(vis).sort(order)) h += row(k, d + 1);
    return h;
  };
  const clients = new Map();
  for (const t of roots) {
    if (!clients.has(t.client)) clients.set(t.client, []);
    clients.get(t.client).push(t);
  }
  const of = c => all.filter(t => t.client === c);
  const rank = c => [of(c).some(t => T_YOU.has(t.status)) ? 0 : 1, -Math.max(...of(c).map(t => t.updated))];
  return [...clients.keys()].sort((a, b) => { const x = rank(a), y = rank(b); return x[0] - y[0] || x[1] - y[1]; }).map(c => {
    const ts = of(c), you = ts.filter(t => T_YOU.has(t.status)).length, open = ts.filter(isOpen).length;
    const repos = new Map();
    for (const t of clients.get(c)) {
      if (!repos.has(t.rel || "")) repos.set(t.rel || "", []);
      repos.get(t.rel || "").push(t);
    }
    let h = `<section class="tk-client${you ? " you" : ""}"><div class="tk-client-hd"><span class="tk-client-name">${esc(c)}</span>`
      + `<span class="tk-counts">${you ? needs(you) + " · " : ""}${open} open · ${ts.length - open} closed</span></div>`;
    for (const [rel, list] of [...repos].sort((a, b) => (a[0] === "") - (b[0] === "") || a[0].localeCompare(b[0]))) {
      h += `<div class="tk-repo">${rel ? esc(rel.split("/").slice(1).join("/") || rel) : `<span class="dim">repo not set</span>`}</div>`;
      for (const t of list) h += row(t, 0);
    }
    return h + `</section>`;
  }).join("");
}

function renderTasks() {
  const all = tkTasks(), open = all.filter(isOpen).length, you = all.filter(t => T_YOU.has(t.status)).length;
  $("tabN").innerHTML = (open ? String(open) : "") + (you ? ` <b>◆${you}</b>` : "");
  if (tab !== "tasks") return;
  $("tkSum").innerHTML = S.tasks?.err ? `<span class="err">${esc(S.tasks.err)}</span>`
    : `${open} open${you ? " · " + needs(you) : ""} · ${all.length - open} closed`;
  $("tkShow").querySelectorAll("[data-show]").forEach(b => b.classList.toggle("on", b.dataset.show === tkShow));
  renderInbox();
  if (tkSel && S.tasks && !S.tasks.err && !all.some(t => t.id === tkSel)) { tkSel = null; tkCur = null; }
  const html = tasksHTML();
  if (html !== tkSig) { $("tkList").innerHTML = html; tkSig = html; }
  const rels = (S.projects || []).map(p => p.rel);
  const opts = [...new Set(rels.map(r => r.split("/")[0]).concat(rels))].sort();
  const dl = JSON.stringify(opts);
  if (dl !== tkDlSig) { $("tkProjects").innerHTML = opts.map(o => `<option value="${esc(o)}">`).join(""); tkDlSig = dl; }
  const cur = all.find(t => t.id === tkSel);
  if (cur && (!tkCur || tkCur.id !== cur.id || tkCur.updated !== cur.updated)) loadTask(cur.id);
  $("tkWrap").classList.toggle("split", !!tkSel);
  renderDetail();
}

async function loadTask(id) {
  if (tkLoading === id) return;
  tkLoading = id;
  try { const t = await api(`/api/task?id=${id}`); if (id === tkSel) tkCur = t; }
  catch (e) { if (id === tkSel) flash = [`could not load task #${id}: ${e.message}`, Date.now()]; }
  finally { tkLoading = null; }
  renderDetail();
}

function renderDetail() {
  $("tkDetail").hidden = !tkSel;
  if (!tkSel) return;
  const t = tkCur && tkCur.id === tkSel ? tkCur : null;
  const sess = tkTasks().find(x => x.id === tkSel)?.sess || null;
  const sig = JSON.stringify([t, sess]) + Math.floor(nowS() / 30);
  if (sig === tkInfoSig) return;
  tkInfoSig = sig;
  if (!t) { $("tkInfo").innerHTML = `<p class="dim">loading #${tkSel}…</p>`; $("tkLog").innerHTML = ""; return; }
  const kv = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : "";
  $("tkInfo").innerHTML = `<div class="tk-d-hd" style="--tc:${tkColor(t)}"><span class="tk-id">#${t.id}</span><span class="tk-badge">${tkIcon(t)} ${esc(tkLabel(t))}</span>`
    + `<button type="button" class="tk-x" data-act="close" title="close (esc)" aria-label="Close">✕</button></div>`
    + `<h2 class="tk-d-title">${esc(t.title)}</h2>`
    + `<dl class="tk-kv">${kv("project", esc(t.rel || `${t.client} · repo not set`))}`
    + kv("parent", t.parent_id ? `<a href="#" data-goto="${t.parent_id}">#${t.parent_id}</a>` : "")
    + kv("source", esc(t.source)) + kv("branch", t.branch ? `<span class="cy">${esc(t.branch)}</span>` : "")
    + kv("created", `${ago(t.created * 1000)} ago`) + `</dl>`
    + sessHTML(t, sess)
    + (t.report ? `<div class="tk-sec">report</div><div class="tk-text">${esc(t.report)}</div>` : "")
    + (t.changes ? `<div class="tk-sec">changes</div><dl class="tk-kv">${kv("worktree", t.changes.worktree ? esc(home(t.changes.worktree)) : `<span class="dim">none</span>`)}</dl>`
      + (t.changes.commits ? `<div class="tk-text tk-code">${esc(t.changes.commits)}${t.changes.stat ? "\n\n" + esc(t.changes.stat) : ""}</div>` : `<p class="dim">no commits on the branch yet</p>`) : "")
    + (t.result ? `<div class="tk-sec">${t.kind === "check" ? "findings" : "plan"}</div><div class="tk-text">${esc(t.result)}</div>` : "")
    + `<div class="tk-sec">description</div>` + (t.summary ? `<div class="tk-text">${esc(t.summary)}</div>` : `<p class="dim">no description</p>`)
    + (t.thread ? `<div class="tk-sec">email</div><dl class="tk-kv">${kv("from", esc(t.thread.sender))}${kv("subject", esc(t.thread.subject))}`
      + `${kv("date", esc(when(t.thread.date)))}</dl>`
      + (gmail(t.thread.url) ? `<a class="tk-gmail" href="${esc(gmail(t.thread.url))}" target="_blank" rel="noopener">open in Gmail ↗</a>` : "") : "");
  $("tkLog").innerHTML = t.events.slice().reverse().map(e => `<div class="tk-ev"><span class="tk-ev-t">${ago(e.t * 1000)}</span>`
    + `<span class="tk-ev-k">${esc(e.kind)}</span><span class="x">${esc(e.kind === "status" ? e.text.replace(/\w+/g, s => TS[s]?.[0] ?? s) : e.text)}</span></div>`).join("");
  for (const [id, v] of [["tkStatus", t.status], ["tkPrio", t.priority || ""], ["tkKind", t.kind]])
    if (document.activeElement !== $(id)) $(id).value = v;
  $("tkOpen").disabled = !t.repo;
  $("tkDismiss").hidden = !(t.source === "email" && isOpen(t));
}

function sessHTML(t, sess) {
  let line, acts;
  if (!t.session_id) {
    line = t.repo ? `No Claude session yet. Analyze opens one in ${esc(S.cfg.terminal?.app || "Terminal")}, in plan mode, in ${esc(home(t.repo))}.`
      : `Set the task's repo (edit, then pick client/repo) to analyze it.`;
    acts = `<button type="button" class="tk-btn primary" data-act="analyze"${t.repo ? "" : " disabled"}>analyze</button>`;
  } else if (sess) {
    const busy = sess.status === "busy";
    line = busy ? `<span class="o"><span data-spin="0">${SPIN[FRAME % 10]}</span> session ${esc(t.session_id.slice(0, 8))} is working</span>${sess.act ? ` <span class="dim">· ${esc(one(sess.act))}</span>` : ""}`
      : t.status === "awaiting_approval" ? `<b class="tk-you">◆ the plan waits for you</b> <span class="dim">in session ${esc(t.session_id.slice(0, 8))}: approve it or comment there</span>`
      : `<span class="tk-you">○ session ${esc(t.session_id.slice(0, 8))} is waiting for you</span>`;
    acts = `<button type="button" class="tk-btn primary" data-act="focus">focus session</button>`;
  } else if (t.status === "analyzing" && nowS() - t.updated < 90) {
    line = `<span class="o"><span data-spin="0">${SPIN[FRAME % 10]}</span> starting session ${esc(t.session_id.slice(0, 8))} in ${esc(S.cfg.terminal?.app || "Terminal")}…</span>`;
    acts = "";
  } else {
    line = `<span class="dim">session ${esc(t.session_id.slice(0, 8))} has ended</span>`;
    acts = `<button type="button" class="tk-btn primary" data-act="resume">resume session</button>`
      + `<button type="button" class="tk-btn" data-act="again">analyze again</button>`;
  }
  return `<div class="tk-sess"><div class="tk-sess-line">${line}</div>${acts ? `<div class="tk-acts">${acts}</div>` : ""}</div>`;
}

  ask.placeholder = on ? TIP : `press / to ask Claude · ${TIP}`;
  const log = $("chatLog");
  const sig = JSON.stringify([S.chat.log, S.chat.working, S.chat.working && Math.floor(nowS() - S.chat.t0)]);
  if (sig !== chatSig) {
    const grew = S.chat.log.length + S.chat.working !== (log._n || 0);
    const atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 8;
    log.innerHTML = chatHTML();
    log.hidden = !log.innerHTML;
    log.style.maxHeight = `calc(${S.cfg.chat_rows} * 1.45em + 4px)`;

function renderHint() {
  const keys = chatOn()
    ? "enter send · esc close chat · ctrl-u clear line · /clear new chat"
    : document.activeElement === $("projQ") ? "type to filter · ↑↓ select · enter open in VS Code · esc close"
    : document.activeElement?.closest?.("#tkForm") ? "enter saves (⌘/ctrl-enter in the description) · esc cancels"
    : document.activeElement === $("tkNote") ? "enter saves the note · esc leaves"
    : document.activeElement?.classList?.contains("tx-input") ? "enter send · esc leave · ctrl-u clear line"
    : tab === "tx" ? `1 sessions · 2 tasks · ←↑↓→ select · enter type · n new session · f focus · a ${showAll ? "hide ended" : "show ended"} · / chat · r refresh`
    : tab === "tasks" ? `1 sessions · ↑↓ select · n new task · e edit · esc close · a ${tkShow === "all" ? "open only" : "show all"} · s scan inbox · m inbox log · / chat · r refresh`
    : `←↑↓→ select · enter/click focus · 2 tasks · 3 transcripts · / chat · p projects · a ${showAll ? "hide ended" : "show ended"} · t ${view === "tiles" ? "table" : "tiles"} · r refresh${installPrompt ? " · i install app" : ""}`;
  let h = esc(keys);
  if (flash[0] && Date.now() - flash[1] < 5000) h += `<span class="flash">▸ ${esc(flash[0])}</span>`;
  if (offline) h += `<span class="off">✗ server not reachable, retrying…</span>`;
  $("hint").innerHTML = h;
}

async function api(path, body) {
  const r = await fetch(path, body === undefined
    ? { headers: { "X-CS-Token": TOKEN } }
    : { method: "POST", headers: { "X-CS-Token": TOKEN, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (r.status === 403) reloadForToken();
  if (!r.ok) {
    let m = `HTTP ${r.status}`;
    try { m = (await r.json()).error || m; } catch {}
    throw Object.assign(new Error(m), { status: r.status });
  }
  return r.json();
}

function reloadForToken() {
  let last = 0;
  try { last = Number(sessionStorage.getItem("cs.reload")) || 0; } catch {}
  if (Date.now() - last < 15000) return;
  try { sessionStorage.setItem("cs.reload", String(Date.now())); } catch {}
  location.reload();
}

function applyTheme(t) {

function syncThemes() {
  const pick = $("theme"), list = S.cfg.themes || [];
  const sig = JSON.stringify(list);
  if (pick._sig !== sig) {
    pick.innerHTML = list.map(t => `<option value="${esc(t.id)}">${esc(t.title)}</option>`).join("");
    pick._sig = sig;
  }
  if (Date.now() - themeSetAt < 3000) return;
  const cur = list.find(t => t.id === S.cfg.theme);
  if (cur) { pick.value = cur.id; applyTheme(cur); }
}

function move(key) {
  const rows = S?.sessions || [];
  if (!rows.length) return;
  const ids = rows.map(r => r.sid);
  let cur = ids.indexOf(sel);
  let per = 1;
  if (tab === "tx" || view === "tiles") {
    const tiles = [...$(tab === "tx" ? "txs" : "tiles").children];
    per = Math.max(1, tiles.filter(t => t.offsetTop === tiles[0].offsetTop).length);
  }
  const d = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: per, ArrowUp: -per }[key];
  cur = cur < 0 ? 0 : Math.min(ids.length - 1, Math.max(0, cur + d));
  sel = ids[cur];
  render();
  document.querySelector(`[data-sid="${CSS.escape(sel)}"]`)?.scrollIntoView({ block: "nearest" });
}

document.addEventListener("keydown", e => {
  if (e.target.closest?.("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === "1" || k === "2" || k === "3") { setTab({ 1: "sessions", 2: "tasks", 3: "tx" }[k]); return; }
  if (tab === "tx") {
    if (k === "Enter") { e.preventDefault(); document.querySelector(`.txbox[data-sid="${CSS.escape(sel || "")}"] input`)?.focus(); return; }
    if (k === "f" || k === "F") { e.preventDefault(); focusSel(); return; }
    if (k === "n" || k === "N") { e.preventDefault(); $("txNew").elements.cwd.focus(); return; }
    if (k === " " || k === "t" || k === "T") return;
  }
  if (tab === "tasks") {
    if (k === "ArrowDown" || k === "ArrowUp") { e.preventDefault(); moveTask(k === "ArrowDown" ? 1 : -1); return; }
    if (k === "n" || k === "N") { e.preventDefault(); openForm("new"); return; }
    if ((k === "e" || k === "E") && tkCur && tkCur.id === tkSel) { e.preventDefault(); openForm("edit", tkCur); return; }
    if (k === "Escape") { if (!$("tkForm").hidden) closeForm(); else selectTask(null); return; }
    if (k === "a" || k === "A") { tkShow = tkShow === "all" ? "open" : "all"; store.set("cs.tkshow", tkShow); render(); return; }
    if (k === "s" || k === "S") { e.preventDefault(); scanNow(); return; }
    if (k === "m" || k === "M") { e.preventDefault(); toggleMail(); return; }
    if (k === "Enter" || k === " " || k.startsWith("Arrow") || k === "t" || k === "T") return;
  }
  if (k.startsWith("Arrow")) { e.preventDefault(); move(k); }
  else if (k === "Enter" || k === " ") { e.preventDefault(); focusSel(); }
  else if (k === "/") { e.preventDefault(); ask.focus(); }
  else if (k === "p" || k === "P") { e.preventDefault(); $("projQ").focus(); }
  else if (k === "a" || k === "A") { showAll = !showAll; store.set("cs.all", showAll ? "1" : "0"); render(); poll(true); }
  else if (k === "r" || k === "R") poll(true);
  else if (k === "i" || k === "I") install();
  else if (k === "t" || k === "T") { view = view === "tiles" ? "table" : "tiles"; store.set("cs.view", view); render(); }
});

ask.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); const t = ask.value.trim(); ask.value = ""; send(t); }
  else if (e.key === "Escape") { e.preventDefault(); ask.blur(); }
  else if (e.ctrlKey && (e.key === "u" || e.key === "U")) { e.preventDefault(); ask.value = ""; }
});

  else if (mk) { const th = mailData?.threads.find(x => x.id === mk.dataset.make); if (th) openForm("thread", th); }
});
async function inboxSet(body) {
  try { await api("/api/inbox/settings", body); }
  catch (e) { flash = [`could not save: ${e.message}`, Date.now()]; }
  await poll();
}
$("tkAuto").addEventListener("change", e => inboxSet({ auto: e.target.checked }));
$("tkEvery").addEventListener("change", e => inboxSet({ every: Number(e.target.value) }));
$("tkTerm").addEventListener("change", async e => {
  try { await api("/api/terminal", { app: e.target.value }); flash = [`task sessions now open in ${e.target.value}`, Date.now()]; }
  catch (err) { flash = [`could not save: ${err.message}`, Date.now()]; }
  await poll();
});
$("tkDismiss").addEventListener("click", async () => {
  const id = tkCur?.id;
  if (id && await tkUpdate({ dismiss: true })) flash = [`#${id} is not a task: rejected, and later scans learn from it`, Date.now()];
  renderHint();
});
$("tkEdit").addEventListener("click", () => { if (tkCur) openForm("edit", tkCur); });
$("tkSub").addEventListener("click", () => { if (tkCur) openForm("sub", tkCur); });
$("tkOpen").addEventListener("click", async () => {
  if (!tkCur?.repo) return;
  try { flash = [(await api("/api/task/open", { id: tkCur.id })).msg, Date.now()]; }
  catch (e) { flash = [`could not open it: ${e.message}`, Date.now()]; }
  renderHint();
});
$("tkDel").addEventListener("click", async () => {
  const t = tkCur;
  if (!t || !confirm(`Delete #${t.id} "${t.title}"${tkTasks().some(x => x.parent_id === t.id) ? " and its subtasks" : ""}?`)) return;
  try {
    await api("/api/task/delete", { id: t.id });
    flash = [`deleted #${t.id}`, Date.now()];
    tkSel = tkCur = null;
  } catch (e) {
    flash = [`could not delete #${t.id}: ${e.message}`, Date.now()];
  }
  await poll();
});
const tkNote = $("tkNote");
tkNote.addEventListener("keydown", async e => {
  if (e.key === "Escape") { e.preventDefault(); tkNote.blur(); return; }
  if (e.key !== "Enter" || e.isComposing) return;
  e.preventDefault();
  const text = tkNote.value.trim();
  if (!text) return;
  tkNote.value = "";
  if (!await tkUpdate({ note: text })) tkNote.value = text;
});
tkNote.addEventListener("focus", renderHint);
tkNote.addEventListener("blur", renderHint);

$("tiles").addEventListener("click", pick);
$("table").addEventListener("click", pick);

setInterval(() => {
  if (RM.matches) return;
  FRAME++;
  document.querySelectorAll("[data-spin]").forEach(el => el.textContent = SPIN[(FRAME + 3 * Number(el.dataset.spin)) % 10]);
  document.querySelectorAll("[data-pulse]").forEach(el => el.textContent = Math.floor(FRAME / 4) % 2 ? "○" : "●");
  document.querySelectorAll("[data-legs]").forEach(el => el.textContent = Math.floor(FRAME / 3) % 2 ? LEGS_B : LOGO[2]);
  document.querySelectorAll("[data-star]").forEach(el => el.textContent = STAR[FRAME % 10]);
}, 150);

setInterval(() => {
  if (S) render();
  if (Date.now() - lastPoll >= (S?.chat.working ? 700 : 2000)) poll();
}, 1000);

render();
poll();
</script>
</body>
</html>
